name: Release (publish npm)

# Runs when a release/* branch is pushed/created. Builds the package and
# publishes it to npm (Trusted Publishing, see the step below).
# The playground demo is no longer deployed from here (the Firebase project
# `smalldat` was deleted on 2026-11-16); it will move to bmesoft.eu.

on:
  push:
    branches: ['release/**']
  workflow_dispatch: {}

# Serialize releases.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm provenance (Trusted Publishing)

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml

  release:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Auto-bump patch past the highest already on npm (major.minor from
      # package.json). Working-tree only — nothing is committed back.
      - name: Compute next version
        run: echo "Publishing $(node scripts/ci-version.mjs)"

      - name: Build package
        run: npm run build

      # Drops the "## Status" prose and the "Publish to GitHub Pages" note —
      # both are about the GitHub project, not useful on the npm package page.
      # Working-tree only, like the version bump above — the repo's README.md
      # (and its GitHub Pages copy) keep both sections.
      - name: Trim README for npm
        run: node scripts/npm-readme.mjs

      # Auth via OIDC Trusted Publishing — no NPM_TOKEN. Requires a trusted
      # publisher configured on npmjs for this repo + workflow, and the
      # id-token: write permission set above. Provenance is automatic.
      - name: Publish to npm
        run: npm publish --access public
